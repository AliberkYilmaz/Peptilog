name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Distribute APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch isar_flutter_libs for AGP 8.x
        run: |
          ISAR_DIR="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android"
          BUILD_GRADLE="$ISAR_DIR/build.gradle"
          MANIFEST="$ISAR_DIR/src/main/AndroidManifest.xml"
          if [ -f "$BUILD_GRADLE" ]; then
            grep -q "namespace" "$BUILD_GRADLE" || \
              sed -i "s/android {/android {\n    namespace 'dev.isar.isar_flutter_libs'/" "$BUILD_GRADLE"
            sed -i "s/compileSdkVersion [0-9]*/compileSdkVersion 36/" "$BUILD_GRADLE"
          fi
          [ -f "$MANIFEST" ] && sed -i 's/ package="[^"]*"//g' "$MANIFEST"

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Write google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode \
            > android/app/google-services.json

      - name: Write keystore + key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/peptilog-release.jks
          cat > android/key.properties <<KEY
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=peptilog-release.jks
          KEY

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/app/peptilog-release.jks
          rm -f android/key.properties
          rm -f android/app/google-services.json

      - name: Get release notes
        id: release_notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty="%s%n%b" | head -10 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: aliberkyilmaz@gmail.com,arabelafarinas@gmail.com
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.release_notes.outputs.notes }}
