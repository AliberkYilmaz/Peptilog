name: peptilog_app
description: "Peptilog — mobile app for tracking peptide injections, weight, and health metrics."
publish_to: 'none'

version: 1.0.20+20

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.5

  # Cloud backend
  supabase_flutter: ^2.9.0
  app_links: ^6.3.2

  # In-app debug logger / error capture (Talker — replaces ad-hoc PEP-78 diagnostics)
  # Pinned to 4.x because 5.x requires share_plus ^13 which conflicts with
  # flutter_secure_storage 9.x's win32 ^5 requirement.
  talker_flutter: ^4.8.4

  # Firebase (minimum for App Distribution device recognition)
  firebase_core: ^3.6.0

  # Navigation
  go_router: ^15.0.0

  # UI / Charts
  fl_chart: ^0.71.0
  table_calendar: ^3.2.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # Monitoring
  sentry_flutter: ^9.0.0

  # Reminders / Notifications
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^5.0.0
  timezone: ^0.9.4

  # Sync / Connectivity
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.3.0

  # Export / Sharing
  csv: ^6.0.0
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.3

  # Code generation
  # isar_generator 3.x requires source_gen <2.0.0; riverpod_generator 2.x requires source_gen ^2.0.0.
  # Resolution: isar_generator is run from tools/isar_codegen/ (separate pub env).
  # See tools/isar_codegen/README.md and scripts/gen_isar.sh for instructions.
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/peptilog-logo-master.png
  adaptive_icon_background: '#0F0F0F'
  adaptive_icon_foreground: assets/branding/peptilog-logo-master.png
  min_sdk_android: 24
